<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tangan Ini Angka Berapa? Pengenal Angka 5 dan 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #101828;
    --bg: #f2f4f7;
    --panel: #ffffff;
    --muted: #5b6577;
    --sun: #ffd23f;
    --blue: #2f6bff;
    --gray: #dfe3ea;
    --ok: #12b76a;
    --bad: #f04438;
    --display: "Unbounded", "Segoe UI", system-ui, sans-serif;
    --body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
    --shadow: 7px 7px 0 var(--ink);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; color: var(--ink); font-family: var(--body); line-height: 1.55;
    background-color: var(--bg);
    background-image: radial-gradient(#cfd5df 1.2px, transparent 1.2px);
    background-size: 22px 22px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }

  /* ---------- Kepala ---------- */
  header { padding: 38px 0 30px; }
  .chip {
    display: inline-block; font-weight: 700; font-size: .82rem; padding: 5px 14px; margin-bottom: 16px;
    border: 2px solid var(--ink); border-radius: 999px; background: var(--panel);
  }
  h1 {
    font-family: var(--display); font-weight: 800; letter-spacing: -0.04em; line-height: 1.04;
    font-size: clamp(1.9rem, 5.2vw, 3.5rem); margin: 0 0 14px; max-width: 16ch;
  }
  header p { margin: 0; max-width: 54ch; color: var(--muted); font-size: 1.05rem; }

  /* ---------- Tata letak ---------- */
  .stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 30px; padding-bottom: 60px; align-items: stretch; }
  @media (max-width: 800px) { .stage { grid-template-columns: 1fr; gap: 26px; } }

  .card {
    border: 3px solid var(--ink); border-radius: 28px; box-shadow: var(--shadow);
    padding: 22px; min-width: 0;
  }
  .input-card { background: var(--panel); }

  /* ---------- Tab ---------- */
  .tabs { display: grid; grid-template-columns: 1fr 1fr; border: 3px solid var(--ink); border-radius: 999px; overflow: hidden; margin-bottom: 20px; }
  .tabs button {
    font: inherit; font-weight: 700; padding: 10px 8px; border: 0; background: var(--panel);
    color: var(--ink); cursor: pointer;
  }
  .tabs button + button { border-left: 3px solid var(--ink); }
  .tabs button[aria-selected="true"] { background: var(--ink); color: #fff; }
  .tabs button:not([aria-selected="true"]):hover { background: var(--gray); }
  .pane[hidden] { display: none; }

  /* ---------- Bingkai kamera / gambar ---------- */
  .frame { position: relative; width: 100%; max-width: 440px; margin: 0 auto 18px; }
  .view {
    aspect-ratio: 1 / 1; width: 100%; background: var(--ink); border-radius: 20px; border: 3px solid var(--ink);
    display: grid; place-items: center; overflow: hidden;
  }
  .view canvas, .view img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .view .placeholder { color: #aab3c5; text-align: center; padding: 0 30px; font-size: .95rem; }
  .view .placeholder svg { display: block; margin: 0 auto 12px; }

  .live {
    position: absolute; top: 14px; left: 14px; z-index: 3; display: inline-flex; align-items: center; gap: 7px;
    padding: 3px 12px 3px 9px; border: 2px solid var(--ink); border-radius: 999px; background: var(--panel);
    font-size: .8rem; font-weight: 700;
  }
  .live[hidden] { display: none; }
  .live i { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  .tag {
    position: absolute; left: 14px; bottom: 14px; z-index: 3; max-width: calc(100% - 28px);
    padding: 5px 14px; border: 2px solid var(--ink); border-radius: 999px; font-weight: 700; font-size: .92rem;
    background: var(--gray); color: var(--ink);
  }
  .tag[hidden] { display: none; }
  .tag[data-s="lima"] { background: var(--sun); }
  .tag[data-s="tiga"] { background: var(--blue); color: #fff; }

  /* ---------- Tombol ---------- */
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font: inherit; font-weight: 700; padding: 11px 24px; border: 3px solid var(--ink); border-radius: 999px;
    background: var(--sun); color: var(--ink); cursor: pointer; box-shadow: 3px 3px 0 var(--ink);
    transition: transform .1s, box-shadow .1s;
  }
  .btn:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
  .btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .btn.secondary { background: var(--panel); }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: 3px 3px 0 var(--ink); }
  .btn:focus-visible, .tabs button:focus-visible, .drop:focus-within { outline: 3px solid var(--blue); outline-offset: 3px; }

  .drop {
    position: relative; display: block; text-align: center; cursor: pointer; color: var(--muted);
    border: 3px dashed var(--ink); border-radius: 18px; padding: 16px; transition: background .15s;
  }
  .drop.over { background: #e9f0ff; color: var(--ink); }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .drop strong { color: var(--ink); text-decoration: underline; text-decoration-thickness: 3px; text-decoration-color: var(--sun); text-underline-offset: 3px; }

  #status {
    display: flex; gap: 10px; align-items: flex-start; margin-top: 20px; padding-top: 16px;
    border-top: 2px solid var(--gray); font-size: .9rem; color: var(--muted);
  }
  #status::before { content: ""; flex: none; width: 11px; height: 11px; border-radius: 50%; margin-top: 6px; background: #98a2b3; border: 2px solid var(--ink); }
  #status.ok::before { background: var(--ok); }
  #status.error { color: #b42318; }
  #status.error::before { background: var(--bad); }

  /* ---------- Kartu hasil: warna mengikuti angka ---------- */
  .result-card {
    --card-bg: var(--gray); --card-ink: var(--ink);
    background: var(--card-bg); color: var(--card-ink); display: flex; flex-direction: column;
    transition: background .2s, color .2s;
  }
  .result-card[data-state="lima"] { --card-bg: var(--sun); }
  .result-card[data-state="tiga"] { --card-bg: var(--blue); --card-ink: #fff; }

  .result-card h2 { margin: 0; font-size: .92rem; font-weight: 700; opacity: .75; }
  .big {
    font-family: var(--display); font-weight: 800; letter-spacing: -0.06em; line-height: .95;
    font-size: clamp(7rem, 20vw, 12rem); margin: 10px 0 0; min-height: .95em;
  }
  .big.idle { opacity: .28; }
  .big.pop { animation: pop .28s ease-out; }
  @keyframes pop { 0% { transform: scale(.82); } 70% { transform: scale(1.06); } 100% { transform: scale(1); } }
  .word { font-family: var(--display); font-weight: 500; font-size: 1.35rem; margin: 8px 0 2px; min-height: 1.5em; }
  .conf { margin: 0 0 26px; opacity: .85; min-height: 1.55em; }

  .bars { display: grid; gap: 14px; margin-top: auto; }
  .bar-head { display: flex; justify-content: space-between; font-weight: 700; font-size: .92rem; margin-bottom: 5px; }
  .track { height: 16px; border: 3px solid var(--card-ink); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--card-ink); opacity: .4; transition: width .12s linear, opacity .15s; }
  .fill.top { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .fill, .btn, .result-card { transition: none; }
    .live i, .big.pop { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="chip">5 atau 3 · pengenal tangan</span>
    <h1>Tangan ini angka berapa?</h1>
    <p>Tunjukkan tangan ke kamera atau unggah fotonya. Model membedakan apakah tangan membentuk angka 5 atau angka 3.</p>
  </header>

  <main class="stage">
    <section class="card input-card" aria-label="Input">
      <div class="tabs" role="tablist" aria-label="Sumber input">
        <button role="tab" id="tab-camera" aria-selected="true" aria-controls="pane-camera">Kamera live</button>
        <button role="tab" id="tab-upload" aria-selected="false" aria-controls="pane-upload">Unggah gambar</button>
      </div>

      <div class="pane" id="pane-camera" role="tabpanel" aria-labelledby="tab-camera">
        <div class="frame">
          <span class="live" id="live" hidden><i></i>Live</span>
          <div class="view" id="webcam-container"></div>
          <span class="tag" id="tag-cam" hidden></span>
        </div>
        <div class="row">
          <button class="btn" id="btn-start" type="button">Mulai kamera</button>
          <button class="btn secondary" id="btn-stop" type="button" disabled>Hentikan</button>
        </div>
      </div>

      <div class="pane" id="pane-upload" role="tabpanel" aria-labelledby="tab-upload" hidden>
        <div class="frame">
          <div class="view" id="upload-view"></div>
          <span class="tag" id="tag-up" hidden></span>
        </div>
        <label class="drop" id="drop">
          <input type="file" id="file" accept="image/*">
          <strong>Pilih gambar</strong> atau seret dan lepas ke sini
        </label>
      </div>

      <div id="status">Model belum dimuat.</div>
    </section>

    <aside class="card result-card" id="result" data-state="idle" aria-live="polite" aria-label="Hasil prediksi">
      <h2>Terbaca sebagai</h2>
      <div class="big idle" id="big">–</div>
      <div class="word" id="word"></div>
      <p class="conf" id="conf">Menunggu input.</p>
      <div class="bars" id="bars"></div>
    </aside>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.7.4/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script>
  // Folder model hasil ekspor Teachable Machine (model.json, metadata.json, weights.bin)
  const MODEL_URL = "./my_model/";
  // Di bawah batas ini hasil dianggap tidak yakin
  const THRESHOLD = 0.6;
  // Tampilan tiap label model (dicocokkan lewat nama, jadi urutan kelas di model tidak masalah)
  const LABELS = {
    "LIMA":     { digit: "5", word: "Lima", bar: "Angka 5", state: "lima" },
    "TIGA":     { digit: "3", word: "Tiga", bar: "Angka 3", state: "tiga" },
    "NO INPUT": { digit: "–", word: "Tidak ada tangan", bar: "Tidak ada tangan", state: "none" }
  };
  const info = (c) => LABELS[c] || { digit: c, word: c, bar: c, state: "none" };

  const CAM_ICON = '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.6"/></svg>';
  const IMG_ICON = '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 9"/></svg>';
  const camPlaceholder = (t) => '<div class="placeholder">' + CAM_ICON + t + '</div>';
  const imgPlaceholder = '<div class="placeholder">' + IMG_ICON + 'Pratinjau gambar muncul di sini.</div>';

  let model = null, webcam = null, rafId = null, running = false;
  let barFills = [], barValues = [], lastDigit = "";

  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");
  const pct = (x, d) => (x * 100).toLocaleString("id-ID", { minimumFractionDigits: d, maximumFractionDigits: d });

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = kind || "";
  }

  function setTag(text, state) {
    ["tag-cam", "tag-up"].forEach((id) => {
      const t = $(id);
      t.hidden = !text;
      t.textContent = text || "";
      t.dataset.s = state || "";
    });
  }

  function setDisplay(state, digit, idle, word, conf) {
    $("result").dataset.state = state;
    const big = $("big");
    big.textContent = digit;
    big.classList.toggle("idle", idle);
    if (digit !== lastDigit && !idle) {
      big.classList.remove("pop"); void big.offsetWidth; big.classList.add("pop");
    }
    lastDigit = idle ? "" : digit;
    $("word").textContent = word;
    $("conf").textContent = conf;
  }

  async function loadModel() {
    if (model) return model;
    setStatus("Memuat model…");
    try {
      model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
    } catch (e) {
      console.error(e);
      setStatus("Model gagal dimuat. Pastikan folder my_model/ ada di samping file ini dan halaman dibuka lewat server lokal (http://localhost), bukan file://.", "error");
      throw e;
    }
    buildBars(model.getClassLabels());
    setStatus("Model siap.", "ok");
    return model;
  }

  function buildBars(labels) {
    const box = $("bars");
    box.innerHTML = "";
    barFills = []; barValues = [];
    labels.forEach((name) => {
      const wrap = document.createElement("div");
      const head = document.createElement("div");
      head.className = "bar-head";
      const n = document.createElement("span"); n.textContent = info(name).bar;
      const v = document.createElement("span"); v.textContent = "0%";
      head.append(n, v);
      const track = document.createElement("div"); track.className = "track";
      const fill = document.createElement("div"); fill.className = "fill";
      track.appendChild(fill);
      wrap.append(head, track);
      box.appendChild(wrap);
      barFills.push(fill); barValues.push(v);
    });
  }

  function showPrediction(pred) {
    let top = 0;
    pred.forEach((p, i) => { if (p.probability > pred[top].probability) top = i; });
    pred.forEach((p, i) => {
      barFills[i].style.width = (p.probability * 100).toFixed(1) + "%";
      barFills[i].classList.toggle("top", i === top);
      barValues[i].textContent = pct(p.probability, 0) + "%";
    });

    const p = pred[top], meta = info(p.className);
    if (p.probability < THRESHOLD) {
      setDisplay("unsure", "?", true, "Belum yakin", "Dekatkan tangan dan pastikan jari terlihat jelas.");
      setTag("Belum yakin", "none");
    } else if (meta.state === "none") {
      setDisplay("none", "–", true, meta.word, "Tunjukkan tangan ke kamera.");
      setTag(meta.word, "none");
    } else {
      setDisplay(meta.state, meta.digit, false, meta.word, "Keyakinan " + pct(p.probability, 1) + "%");
      setTag(meta.word + " · " + pct(p.probability, 0) + "%", meta.state);
    }
  }

  function resetResult() {
    setDisplay("idle", "–", true, "", "Menunggu input.");
    setTag("");
    barFills.forEach((f) => { f.style.width = "0"; f.classList.remove("top"); });
    barValues.forEach((v) => { v.textContent = "0%"; });
  }

  /* ---------- Kamera live ---------- */
  function cameraErrorMessage(e) {
    const n = e && e.name;
    if (n === "NotAllowedError" || n === "SecurityError")
      return "Akses kamera ditolak. Klik ikon gembok atau kamera di sebelah kiri address bar, pilih Izinkan, lalu muat ulang halaman.";
    if (n === "NotFoundError" || n === "OverconstrainedError")
      return "Kamera tidak ditemukan. Pastikan webcam terpasang dan aktif.";
    if (n === "NotReadableError" || n === "AbortError")
      return "Kamera sedang dipakai aplikasi lain (Zoom, Meet, Teams, dan sejenisnya). Tutup aplikasi itu lalu tekan Mulai kamera lagi.";
    if (!navigator.mediaDevices || !window.isSecureContext)
      return "Browser memblokir kamera di alamat ini. Buka lewat http://localhost atau https, bukan alamat IP atau file.";
    return "Kamera tidak bisa dibuka (" + (n || "error tidak dikenal") + ").";
  }

  async function startCamera() {
    if (running) return;
    $("btn-start").disabled = true;
    try {
      await loadModel();
    } catch (e) {
      $("btn-start").disabled = false;
      return; // pesan sudah ditampilkan oleh loadModel
    }
    try {
      setStatus("Meminta akses kamera… klik Izinkan jika browser bertanya.");
      webcam = new tmImage.Webcam(400, 400, true); // lebar, tinggi, cermin
      await webcam.setup();
      await webcam.play();
    } catch (e) {
      console.error(e);
      setStatus(cameraErrorMessage(e), "error");
      $("btn-start").disabled = false;
      webcam = null;
      return;
    }
    const box = $("webcam-container");
    box.innerHTML = "";
    box.appendChild(webcam.canvas);
    running = true;
    $("live").hidden = false;
    $("btn-stop").disabled = false;
    setStatus("Kamera aktif.", "ok");
    rafId = requestAnimationFrame(loop);
  }

  async function loop() {
    if (!running) return;
    webcam.update();
    const pred = await model.predict(webcam.canvas);
    if (running) showPrediction(pred);
    rafId = requestAnimationFrame(loop);
  }

  function stopCamera() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (webcam) { webcam.stop(); webcam = null; }
    $("webcam-container").innerHTML = camPlaceholder("Kamera dihentikan. Tekan “Mulai kamera” untuk lanjut.");
    $("live").hidden = true;
    $("btn-start").disabled = false;
    $("btn-stop").disabled = true;
    resetResult();
    if (model) setStatus("Model siap.", "ok");
  }

  /* ---------- Unggah gambar ---------- */
  async function handleFile(file) {
    if (!file) return;
    if (!file.type.startsWith("image/")) {
      setStatus("File harus berupa gambar (JPG, PNG, atau WebP).", "error");
      return;
    }
    const img = new Image();
    img.alt = "Gambar yang diunggah";
    img.onload = async () => {
      const box = $("upload-view");
      box.innerHTML = "";
      box.appendChild(img);
      try {
        await loadModel();
        showPrediction(await model.predict(img));
        setStatus("Gambar selesai dianalisis.", "ok");
      } catch (e) { /* pesan sudah ditampilkan oleh loadModel */ }
    };
    img.onerror = () => setStatus("Gambar tidak bisa dibaca. Coba file lain.", "error");
    img.src = URL.createObjectURL(file);
  }

  /* ---------- Tab ---------- */
  function selectTab(which) {
    const cam = which === "camera";
    $("tab-camera").setAttribute("aria-selected", cam);
    $("tab-upload").setAttribute("aria-selected", !cam);
    $("pane-camera").hidden = !cam;
    $("pane-upload").hidden = cam;
    if (!cam && running) stopCamera();
    resetResult();
  }

  $("webcam-container").innerHTML = camPlaceholder("Mengaktifkan kamera… klik Izinkan jika browser bertanya.");
  $("upload-view").innerHTML = imgPlaceholder;
  buildBars(["NO INPUT", "LIMA", "TIGA"]); // kerangka bar sebelum model dimuat

  $("tab-camera").addEventListener("click", () => selectTab("camera"));
  $("tab-upload").addEventListener("click", () => selectTab("upload"));
  $("btn-start").addEventListener("click", startCamera);
  $("btn-stop").addEventListener("click", stopCamera);
  $("file").addEventListener("change", (e) => handleFile(e.target.files[0]));

  // Kamera dicoba aktif otomatis saat halaman dibuka
  window.addEventListener("load", () => {
    if (location.protocol === "file:") {
      $("webcam-container").innerHTML = camPlaceholder("Kamera belum aktif.");
      setStatus("Halaman dibuka lewat file://, model tidak bisa dimuat. Jalankan server lokal dulu (lihat MULAI.txt), lalu buka http://localhost:8000.", "error");
      return;
    }
    startCamera();
  });

  const drop = $("drop");
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => handleFile(e.dataTransfer.files[0]));
</script>
</body>
</html>
